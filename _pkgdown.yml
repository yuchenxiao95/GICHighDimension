home:
  title: "Fast Variable Selection with Information Criteria"

navbar:
  structure:
    left:  [reference, articles, news]
    right: [search, julia, github]
  components:
    julia:
      text: Julia package
      href: https://github.com/yuchenxiao95/GICVariableSelection
      aria-label: GICVariableSelection, the Julia version of this package

reference:
- title: Variable selection
  desc: >
    Search over variable subsets to maximize an information criterion. This is
    how you will usually use the package.
  contents:
  - GICSelection
  - GICSelectionBoltzmann
- title: Information criteria
  desc: |
    Pass the name of a criterion to `GICSelection()`, or call these functions
    directly to score a single model.
    The supported criteria are:

    - **AIC**: Akaike information criterion (Akaike, 1974)
    - **AICc**: AIC corrected for small samples (Hurvich and Tsai, 1989)
    - **BIC**: Bayesian information criterion (Schwarz, 1978)
    - **CAIC**: consistent AIC (Bozdogan, 1987)
    - **CAICF**: consistent AIC with Fisher information (Bozdogan, 1987)
    - **SIC**: square-root information criterion (Shao, 1997; Xiao and Walker, 2026)
    - **GIC2–GIC6**: generalized information criteria for high dimensions (Kim, Kwon and Choi, 2012)
    - **EBIC**: extended BIC (Chen and Chen, 2008)
    - **AttIC**: attention-weighted criterion, specific to this package

    Full citations are on the `information_criteria` help page.
  contents:
  - information_criteria
- title: Simulation and link transforms
  desc: >
    Simulate responses from a linear predictor, map responses to the
    linear-predictor scale, and generate sparse coefficient vectors. All
    common GLM families are supported.
  contents:
  - LP_to_Y
  - Y_to_LP
  - Generate_Beta
- title: Estimation
  desc: Estimate the coefficients of a selected model.
  contents:
  - Beta_estimate
- title: Julia setup
  desc: Connect R to Julia and install the Julia packages the package needs.
  contents:
  - setup_julia
  - install_julia_packages
  - install_julia_dependencies

